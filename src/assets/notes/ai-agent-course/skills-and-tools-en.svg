<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="450"
  viewBox="0 0 640 600"
  role="img"
  aria-labelledby="title desc"
  xml:lang="en"
>
  <title id="title">Add a Skill and use its guidance</title>
  <desc id="desc">
    Give the chatbot a GitHub Skill URL, let the app install the Skill, choose
    whether to use it in conversation, then use its guidance when the HTML tool
    saves a document.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path
        d="M 1 1 L 9 5 L 1 9"
        fill="none"
        stroke="#8a4518"
        stroke-width="1.6"
      />
    </marker>
  </defs>
  <rect width="640" height="600" fill="#eee7dc" />
  <g font-family="Google Sans Code, Consolas, monospace">
    <text
      x="320"
      y="42"
      font-size="28"
      text-anchor="middle"
      fill="#2b2723"
      font-weight="500"
    >
      Add a Skill and use its guidance
    </text>
    <rect
      x="48"
      y="68"
      width="544"
      height="84"
      rx="3"
      fill="#f8f3ec"
      stroke="#bfae9b"
      stroke-width="1.5"
    />
    <text
      x="320.0"
      y="104.0"
      font-size="26.667"
      text-anchor="middle"
      fill="#2b2723"
      font-weight="400"
    >
      1. Send the Skill URL in chat
    </text>
    <text
      x="320.0"
      y="132.0"
      font-size="25.333"
      text-anchor="middle"
      fill="#6a625a"
      font-weight="400"
    >
      A GitHub link to the guidelines
    </text>
    <path
      d="M 320 152 V 188"
      fill="none"
      stroke="#8a4518"
      stroke-width="1.8"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <rect
      x="48"
      y="188"
      width="544"
      height="84"
      rx="3"
      fill="#f8f3ec"
      stroke="#bfae9b"
      stroke-width="1.5"
    />
    <text
      x="320.0"
      y="224.0"
      font-size="26.667"
      text-anchor="middle"
      fill="#2b2723"
      font-weight="400"
    >
      2. The app installs the Skill
    </text>
    <text
      x="320.0"
      y="252.0"
      font-size="25.333"
      text-anchor="middle"
      fill="#6a625a"
      font-weight="400"
    >
      Make the guideline files available
    </text>
    <path
      d="M 320 272 V 308"
      fill="none"
      stroke="#8a4518"
      stroke-width="1.8"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <rect
      x="48"
      y="308"
      width="544"
      height="84"
      rx="3"
      fill="#f8f3ec"
      stroke="#bfae9b"
      stroke-width="1.5"
    />
    <text
      x="320.0"
      y="344.0"
      font-size="26.667"
      text-anchor="middle"
      fill="#2b2723"
      font-weight="400"
    >
      3. Enable or disable it in chat
    </text>
    <text
      x="320.0"
      y="372.0"
      font-size="25.333"
      text-anchor="middle"
      fill="#6a625a"
      font-weight="400"
    >
      Use the guidance when requested
    </text>
    <path
      d="M 320 392 V 428"
      fill="none"
      stroke="#8a4518"
      stroke-width="1.8"
      stroke-linejoin="round"
      marker-end="url(#arrow)"
    />
    <rect
      x="48"
      y="428"
      width="544"
      height="84"
      rx="3"
      fill="#f8f3ec"
      stroke="#bfae9b"
      stroke-width="1.5"
    />
    <text
      x="320.0"
      y="464.0"
      font-size="26.667"
      text-anchor="middle"
      fill="#2b2723"
      font-weight="400"
    >
      4. Run the HTML creation tool
    </text>
    <text
      x="320.0"
      y="492.0"
      font-size="25.333"
      text-anchor="middle"
      fill="#6a625a"
      font-weight="400"
    >
      Save a document using the guidance
    </text>
    <text
      x="320"
      y="562"
      font-size="24"
      text-anchor="middle"
      fill="#6a625a"
      font-weight="400"
    >
      Skill: guidance / Tool: action
    </text>
  </g>
</svg>
