<svg
  xmlns="http://www.w3.org/2000/svg"
  width="480"
  height="138"
  viewBox="0 0 640 184"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Review before and after language editing</title>
  <desc id="desc">
    A conceptual workflow: organise content and evidence, refine the English,
    then recheck meaning and citations.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="6"
      markerHeight="6"
      refX="5"
      refY="3"
      orient="auto"
    >
      <path d="M0 0 6 3 0 6" fill="none" stroke="#8a4518" stroke-width="1.2" />
    </marker>
  </defs>
  <g fill="#f8f3ec" stroke="#bfae9b" stroke-width="1.5">
    <rect x="12" y="38" width="180" height="108" rx="3" />
    <rect x="230" y="38" width="180" height="108" rx="3" />
    <rect x="448" y="38" width="180" height="108" rx="3" />
  </g>
  <g fill="none" stroke="#8a4518" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M192 92H230" />
    <path d="M410 92H448" />
  </g>
  <g
    fill="#2b2723"
    font-family="Google Sans Code, Consolas, monospace"
    font-size="19"
    font-weight="400"
    text-anchor="middle"
    dominant-baseline="middle"
  >
    <text x="102" y="77">Content and</text>
    <text x="102" y="109">evidence</text>
    <text x="320" y="77">Refine the</text>
    <text x="320" y="109">English</text>
    <text x="538" y="77">Recheck meaning</text>
    <text x="538" y="109">and citations</text>
  </g>
</svg>
